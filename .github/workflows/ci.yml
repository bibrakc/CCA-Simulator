name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format-check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bibrakc/cca-simulator-ci:latest
    steps:
    - uses: actions/checkout@v4

    - name: Check code formatting
      run: |
        clang-format-21 --version
        find Source Include Applications -name "*.cpp" -o -name "*.hpp" | \
          grep -v build | \
          xargs clang-format-21 --dry-run --Werror

  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bibrakc/cca-simulator-ci:latest
    needs: format-check
    strategy:
      matrix:
        build_type: [Release, Debug]

    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DTHROTTLE=true \
          -DANIMATION=false \
          -DVICINITY=2 \
          -DTERMINATION=false \
          -DMIN_EDGES_PER_VERTEX=10 \
          -DMAXEDGESPERVERTEX=15 \
          -DGHOST_CHILDREN=3 \
          -DTHROTTLE_CONGESTION_THRESHOLD=22 \
          -DRECVBUFFSIZE=4 \
          -DACTIONQUEUESIZE=2048 \
          -DRHIZOME_INDEGREE_CUTOFF=10 \
          -DSPLIT_QUEUES=true

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run tests
      env:
        OMP_NUM_THREADS: 4
      run: |
        mkdir -p build/Output

        echo "=== BFS ==="
        ./build/BFS_CCASimulator \
          -f Input_Graphs/Erdos-Renyi_directed_ef_16_v_11.edgelist -g Erdos \
          -od ./build/Output -s square -root 0 -m 90000 \
          -hx 16 -hy 16 -hdepth 0 -hb 0 -route 0 -mesh 1 -shuffle -verify

        echo "=== BFS Rhizome ==="
        ./build/BFS_Rhizome_CCASimulator \
          -f Input_Graphs/Erdos-Renyi_directed_ef_16_v_11.edgelist -g Erdos \
          -od ./build/Output -s square -root 0 -m 90000 \
          -hx 16 -hy 16 -hdepth 0 -hb 0 -route 0 -mesh 1 -shuffle -verify

        echo "=== SSSP ==="
        ./build/SSSP_CCASimulator \
          -f Input_Graphs/Erdos-Renyi_directed_ef_16_v_11.edgelist -g Erdos \
          -od ./build/Output -s square -root 0 -m 90000 \
          -hx 16 -hy 16 -route 0 -mesh 1 -shuffle -verify

        echo "=== SSSP Rhizome ==="
        ./build/SSSP_Rhizome_CCASimulator \
          -f Input_Graphs/Erdos-Renyi_directed_ef_16_v_11.edgelist -g Erdos \
          -od ./build/Output -s square -root 0 -m 90000 \
          -hx 16 -hy 16 -route 0 -mesh 1 -shuffle -verify

        echo "=== PageRank ==="
        ./build/PageRank_Fixed_Iterations_CCASimulator \
          -f Input_Graphs/Erdos-Renyi_directed_ef_16_v_11.edgelist -g Erdos \
          -od ./build/Output -s square -root 0 -m 90000 \
          -hx 16 -hy 16 -route 0 -mesh 1 -iter 5 -shuffle -verify

        echo "=== PageRank Rhizome ==="
        ./build/PageRank_Fixed_Iterations_Rhizome_CCASimulator \
          -f Input_Graphs/Erdos-Renyi_directed_ef_16_v_11.edgelist -g Erdos \
          -od ./build/Output -s square -root 3 -m 90000 \
          -hx 16 -hy 16 -route 0 -mesh 1 -iter 9 -verify

        echo "=== Dynamic BFS ==="
        ./build/Dynamic_BFS_CCASimulator \
          -f Input_Graphs/Dynamic/1K/streamingEdge_lowOverlap_lowBlockSizeVar_1000_nodes -g DG \
          -od ./build/Output -s square -root 0 -m 90000 \
          -hx 16 -hy 16 -route 0 -mesh 1 -increments 10 -shuffle -verify

        echo "=== Streaming Dynamic BFS ==="
        ./build/Streaming_Dynamic_BFS_CCASimulator \
          -f Input_Graphs/Dynamic/1K/streamingEdge_lowOverlap_lowBlockSizeVar_1000_nodes -g DG_Streaming \
          -od ./build/Output -s square -root 0 -m 90000 \
          -hx 16 -hy 16 -route 0 -mesh 0 -increments 10 -shuffle -verify

  sanitizer:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bibrakc/cca-simulator-ci:latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure with ASan + UBSan
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DSANITIZER=address \
          -DTHROTTLE=true \
          -DANIMATION=false \
          -DVICINITY=2 \
          -DTERMINATION=false \
          -DMIN_EDGES_PER_VERTEX=10 \
          -DMAXEDGESPERVERTEX=15 \
          -DGHOST_CHILDREN=3 \
          -DTHROTTLE_CONGESTION_THRESHOLD=22 \
          -DRECVBUFFSIZE=4 \
          -DACTIONQUEUESIZE=2048 \
          -DSPLIT_QUEUES=true

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run under sanitizer
      env:
        OMP_NUM_THREADS: 1
        ASAN_OPTIONS: detect_leaks=0
      run: |
        mkdir -p build/Output
        ./build/BFS_CCASimulator \
          -f Input_Graphs/Erdos-Renyi_directed_ef_16_v_11.edgelist -g Erdos \
          -od ./build/Output -s square -root 0 -m 90000 \
          -hx 16 -hy 16 -hdepth 0 -hb 0 -route 0 -mesh 1 -verify
        ./build/SSSP_CCASimulator \
          -f Input_Graphs/Erdos-Renyi_directed_ef_16_v_11.edgelist -g Erdos \
          -od ./build/Output -s square -root 0 -m 90000 \
          -hx 16 -hy 16 -route 0 -mesh 1 -verify

  language-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bibrakc/cca-simulator-ci:latest
    steps:
    - uses: actions/checkout@v4

    - name: Run compiler tests
      run: racket Language/tests/run-tests.rkt

    - name: Compile bfs.cca to C++
      run: |
        racket -e '
          (require "Language/compiler/pipeline.rkt")
          (define r (run-pipeline "Language/examples/bfs/bfs.cca"
                                  #:output "generated-bfs"))
          (unless (pipeline-success? r)
            (error "Compilation failed"))
          (printf "Generated: ~a\n" (pipeline-ir r))'

    - name: Build generated BFS application
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DTHROTTLE=true \
          -DANIMATION=false \
          -DVICINITY=2 \
          -DTERMINATION=false \
          -DMIN_EDGES_PER_VERTEX=10 \
          -DMAXEDGESPERVERTEX=15 \
          -DGHOST_CHILDREN=3 \
          -DTHROTTLE_CONGESTION_THRESHOLD=22 \
          -DRECVBUFFSIZE=4 \
          -DACTIONQUEUESIZE=2048 \
          -DSPLIT_QUEUES=true \
          -DCCA_GENERATED_APPLICATIONS_DIR="$PWD/generated-bfs"
        cmake --build build --target BFS_Generated_CCASimulator -j$(nproc)

    - name: Run generated BFS with verification
      env:
        OMP_NUM_THREADS: 4
      run: |
        ./build/BFS_Generated_CCASimulator \
          -f Input_Graphs/Erdos-Renyi_ef_5_v_6.edgelist \
          -g Erdos -s square -root 0 -verify
